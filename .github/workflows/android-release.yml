name: Android Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 推送 tag 时创建 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # 未配置这些 Secret 时取到的都是空串，构建退化为「未签名 APK」；
      # 配上之后 assembleRelease 直接产出已签名的 app-release.apk
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        # 不再使用 android-actions/setup-android：它默认要装早已从 Google 仓库下架的
        # `tools` 包，会以 sdkmanager 退出码 1 直接把整个作业打断。
        # runner 镜像自带 SDK 与 platform-tools，这里只补装本项目缺的组件。
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"

          # 接受许可：AGP 自动下载缺失 SDK 组件时依赖这些许可文件
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # 包名与 compileSdk / buildTools 版本对应；万一名单有变动，
          # 后面 AGP 自己也会按需下载，所以不因这一步失败而中断整个作业。
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" \
            || echo "::warning::sdkmanager 安装未完成，改为交给 AGP 自动下载"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/keystores"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystores/release.jks"
          {
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/keystores/release.jks"
            echo "SIGNING_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        # 项目在 Windows 上开发，git 的 core.fileMode 为 false，可执行位容易再次丢失；
        # 这里兜一刀，避免又因为 ./gradlew: Permission denied 白跑一次。
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -exec cp -v {} dist/ \;
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
